name: heliobay
services:
  mqtt:
    image: eclipse-mosquitto:2.0
    ports:
      - "127.0.0.1:1884:1883"
    volumes:
      - ./infra/mosquitto/development.conf:/mosquitto/config/mosquitto.conf:ro
    healthcheck:
      test: ["CMD", "mosquitto_pub", "-h", "localhost", "-t", "health", "-m", "ok"]
      interval: 5s
      timeout: 3s
      retries: 10
